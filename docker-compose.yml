# Cinny -- unabhaengiger, schlanker Matrix-Web-Client (Alternative zu
# Element/Riot), offizielles Image (Nginx + statisches React-SPA-Build).
# Kein eigener Server-Prozess/API -- der Client spricht direkt per Matrix
# Client-Server-API mit dem Homeserver (hier: matrix.bravokilo.cloud). Das
# Kern-Sync-Protokoll von Matrix (GET /sync) ist HTTP-Long-Polling, keine
# WebSockets -- Cinny nutzt dafuer wie Element den Standard matrix-js-sdk-
# Sync-Mechanismus, ebenfalls ohne WebSockets.
services:
  cinny:
    image: ajbura/cinny:latest
    container_name: cinny
    restart: unless-stopped
    volumes:
      # Setzt den Standard-Homeserver fest, damit man ihn beim Login nicht
      # jedes Mal eintippen muss -- Login mit anderem Server bleibt trotzdem
      # moeglich (allowCustomHomeservers: true).
      - ./config.json:/app/config.json:ro
    ports:
      - "${HOST_PORT:-8095}:80"
